<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MT Racing — Đồ chơi xe máy chính hãng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <!-- Bấm vào logo sẽ về Trang chủ -->
      <a class="logo-link" href="index.html" aria-label="MT Racing trang chủ">
        <img src="images/logo-mt.jpg" alt="MT Racing" style="height: 52px; width: auto; object-fit: contain; display: block;" />
      </a>
      <div class="header-actions">
        <!-- Bấm vào chữ Tài khoản sẽ sang trang Đăng nhập -->
        <a class="icon-btn" href="login.html" aria-label="Tài khoản">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: currentColor;">
            <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2c-4.4 0-8 2.24-8 5v1.5h16V19c0-2.76-3.6-5-8-5Z" />
          </svg>
          <span>Tài khoản</span>
        </a>
        <!-- Bấm vào Giỏ hàng sẽ sang trang Giỏ hàng -->
        <a class="icon-btn" href="cart.html" aria-label="Giỏ hàng" style="color: #ff3333;">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: currentColor;">
            <path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.6 12.2A2 2 0 0 1 16.42 21H7.58a2 2 0 0 1-1.98-1.8L4 7h3Zm2 0h6V6a3 3 0 0 0-6 0v1Z" />
          </svg>
          <span>Giỏ hàng</span>
          <em class="badge" id="cart-count">0</em>
        </a>
      </div>
    </div>
  </header>

  <section class="filter-bar" aria-label="Bộ lọc sản phẩm">
    <form class="filter-inner" id="filter-form">
      <label class="filter-field">
        <span>Sản phẩm</span>
        <select id="filter-product" name="product">
          <option value="">Tất cả sản phẩm</option>
          <option>Pô xe máy</option>
          <option>Phuộc</option>
          <option>Đĩa & tay thắng</option>
          <option>Nhông sên dĩa</option>
          <option>Đèn LED xe máy</option>
          <option>Mâm xe máy</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Thương hiệu</span>
        <select id="filter-brand" name="brand">
          <option value="">Tất cả thương hiệu</option>
          <option>Shark X2</option>
          <option>Akrapovic</option>
          <option>RCB</option>
          <option>Brembo</option>
          <option>Ohlins</option>
          <option>NGK</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Hãng xe</span>
        <select id="filter-make" name="make">
          <option value="">Tất cả hãng xe</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Tên xe</span>
        <select id="filter-model" name="model">
          <option value="">Tất cả tên xe</option>
        </select>
      </label>
      <button class="filter-submit" type="submit">Tìm kiếm</button>
    </form>
  </section>

  <section class="hero" id="hero-slider" aria-label="Banner slider mô tô">
    <div class="hero-slides">
      <article class="hero-slide is-active">
        <img src="images/ducati.jpg" alt="Ducati" />
      </article>
      <article class="hero-slide">
        <img src="images/kawasaki-h2.jpg" alt="Kawasaki H2" />
      </article>
      <article class="hero-slide">
        <img src="images/yamaha-r1.jpg" alt="Yamaha R1" />
      </article>
      <article class="hero-slide">
        <img src="images/bmw-s1000rr.jpg" alt="BMW S1000RR" />
      </article>
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="hero-kicker">MT RACING</p>
      <h1>NÂNG TẦM XẾ YÊU</h1>
      <p class="hero-sub">Đồ chơi xe máy chính hãng</p>
    </div>
    <button class="hero-nav prev" type="button" aria-label="Ảnh trước">‹</button>
    <button class="hero-nav next" type="button" aria-label="Ảnh sau">›</button>
    <div class="hero-dots" role="tablist" aria-label="Chọn slide">
      <button type="button" class="is-active" aria-label="Slide 1"></button>
      <button type="button" aria-label="Slide 2"></button>
      <button type="button" aria-label="Slide 3"></button>
      <button type="button" aria-label="Slide 4"></button>
    </div>
  </section>

  <main class="page-body" id="products">
    <aside class="promo-col" aria-label="Sản phẩm khuyến mãi">
      <h2 class="promo-title">SẢN PHẨM KHUYẾN MÃI</h2>
      <div class="promo-list" id="promo-list"></div>
    </aside>

    <section class="catalog-col" aria-label="Danh sách sản phẩm">
      <div class="catalog-head">
        <h2>Đồ chơi xe máy nổi bật</h2>
        <p id="result-count">8 sản phẩm</p>
      </div>
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <strong>MT Racing</strong>
        <p>Phụ tùng &amp; đồ chơi xe máy, xe PKL, xe tay ga — chính hãng, bảo hành toàn quốc.</p>
      </div>
      <div>
        <p>Hotline: 0793946027</p>
        <p>Email: phannguyenminhtrung0707@gmail.com</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
