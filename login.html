<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - MT Racing</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    * { box-sizing: border-box; }
    .login-page {
      padding: 60px 20px;
      max-width: 500px;
      margin: 0 auto;
      font-family: 'Be Vietnam Pro', sans-serif;
    }
    .breadcrumb { color: #888; font-size: 14px; margin-bottom: 20px; text-align: center; }
    .breadcrumb a { color: #ccc; text-decoration: none; transition: color 0.3s; }
    .breadcrumb a:hover { color: #ff3333; }
    
    .auth-box {
      background: #141414;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .auth-header {
      background: #0a0a0a;
      padding: 15px 30px;
      border-bottom: 1px solid #ff3333;
      text-align: center;
    }
    .auth-header h2 { color: #fff; font-size: 18px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
    
    .auth-form { padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #bbb; font-size: 14px; }
    .form-group input {
      width: 100%; padding: 14px; background: #000; border: 1px solid #333;
      border-radius: 4px; color: #fff; font-family: inherit; transition: all 0.3s;
    }
    .form-group input:focus { outline: none; border-color: #ff3333; background: #111; }
    
    .form-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 14px; cursor: pointer; }
    .checkbox-group input { accent-color: #ff3333; }
    .forgot-link { color: #ff3333; font-size: 14px; text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }
    
    .submit-btn {
      width: 100%; background: #ff3333; color: #fff; border: none; padding: 14px;
      font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.3s;
    }
    .submit-btn:hover { background: #e02828; }
    
    .social-login { margin-top: 25px; padding-top: 20px; border-top: 1px solid #333; text-align: center; }
    .social-login p { color: #888; font-size: 14px; margin-bottom: 15px; }
    .social-btns { display: flex; gap: 15px; }
    .btn-social {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border: none; border-radius: 4px; color: #fff; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn-fb { background: #1877f2; }
    .btn-gg { background: #ea4335; }
    
    .register-hint { text-align: center; margin-top: 20px; font-size: 14px; color: #aaa; }
    .register-hint a { color: #ff3333; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body style="background: #0a0a0a; color: #fff; margin: 0;">
    <header class="site-header">
        <div class="header-inner">
          <!-- Bấm vào logo sẽ về Trang chủ -->
          <a class="logo-link" href="index.html" aria-label="MT Racing trang chủ">
            <img src="images/logo-mt.jpg" alt="MT Racing" style="height: 52px; width: auto; object-fit: contain; display: block;" />
          </a>
          <div class="header-actions">
            <!-- Bấm vào chữ Tài khoản sẽ sang trang Đăng nhập -->
            <a class="icon-btn" href="login.html" aria-label="Tài khoản">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: currentColor;">
                <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2c-4.4 0-8 2.24-8 5v1.5h16V19c0-2.76-3.6-5-8-5Z" />
              </svg>
              <span>Tài khoản</span>
            </a>
            <!-- Bấm vào Giỏ hàng sẽ sang trang Giỏ hàng -->
            <a class="icon-btn" href="cart.html" aria-label="Giỏ hàng" style="color: #ff3333;">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: currentColor;">
                <path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.6 12.2A2 2 0 0 1 16.42 21H7.58a2 2 0 0 1-1.98-1.8L4 7h3Zm2 0h6V6a3 3 0 0 0-6 0v1Z" />
              </svg>
              <span>Giỏ hàng</span>
              <em class="badge" id="cart-count">0</em>
            </a>
          </div>
        </div>
      </header>

  <main class="login-page">
    <div class="breadcrumb">
      <a href="index.html">Trang chủ</a> / Đăng nhập
    </div>
    
    <div class="auth-box">
      <div class="auth-header">
        <h2>Đăng nhập hệ thống</h2>
      </div>
      
      <form class="auth-form" action="index.html">
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Nhập email của bạn" required />
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" placeholder="Nhập mật khẩu" required />
        </div>
        
        <div class="form-actions">
          <label class="checkbox-group">
            <input type="checkbox" /> Nhớ mật khẩu
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>
        
        <button type="submit" class="submit-btn">ĐĂNG NHẬP</button>
        
        <div class="social-login">
          <p>Hoặc đăng nhập bằng</p>
          <div class="social-btns">
            <button type="button" class="btn-social btn-fb">Facebook</button>
            <button type="button" class="btn-social btn-gg">Google</button>
          </div>
        </div>
        
        <div class="register-hint">
          Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
