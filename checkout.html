<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán - MT Racing</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkout-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
    }
    .checkout-heading {
      font-size: 18px;
      color: #fff;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      border: 1px solid #333;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
    }
    .form-control:focus {
      border-color: var(--red);
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .payment-box {
      border: 1px solid #333;
      border-radius: 4px;
      margin-bottom: 30px;
      background: #111;
    }
    .payment-method {
      padding: 15px;
      border-bottom: 1px solid #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .payment-method:last-child {
      border-bottom: none;
    }
    .bank-details {
      background: #0a0a0a;
      padding: 15px;
      border-bottom: 1px solid #333;
      font-size: 14px;
      color: #ccc;
    }
    .bank-details p {
      margin-bottom: 5px;
    }
    .summary-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 20px;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #222;
      align-items: center;
    }
    .summary-item img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
    }
    .summary-item-info {
      flex: 1;
      padding: 0 15px;
    }
    .summary-item-info h4 {
      font-size: 13px;
      color: #fff;
      margin-bottom: 4px;
    }
    .summary-item-info p {
      font-size: 12px;
      color: #888;
    }
    .summary-price {
      font-size: 14px;
      color: #fff;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      font-size: 16px;
      color: #fff;
    }
    .total-row.final {
      font-size: 20px;
      font-weight: 700;
      color: var(--red);
      border-top: 1px solid #333;
      padding-top: 15px;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-submit:hover {
      background: var(--red-hover);
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body style="background: #0a0a0a; color: #fff; margin: 0;">
  
    <header class="site-header">
        <div class="header-inner">
          <!-- Bấm vào logo sẽ về Trang chủ -->
          <a class="logo-link" href="index.html" aria-label="MT Racing trang chủ">
            <img src="images/logo-mt.jpg" alt="MT Racing" style="height: 52px; width: auto; object-fit: contain; display: block;" />
          </a>
          <div class="header-actions">
            <!-- Bấm vào chữ Tài khoản sẽ sang trang Đăng nhập -->
            <a class="icon-btn" href="login.html" aria-label="Tài khoản">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: currentColor;">
                <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2c-4.4 0-8 2.24-8 5v1.5h16V19c0-2.76-3.6-5-8-5Z" />
              </svg>
              <span>Tài khoản</span>
            </a>
            <!-- Bấm vào Giỏ hàng sẽ sang trang Giỏ hàng -->
            <a class="icon-btn" href="cart.html" aria-label="Giỏ hàng" style="color: #ff3333;">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: currentColor;">
                <path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.6 12.2A2 2 0 0 1 16.42 21H7.58a2 2 0 0 1-1.98-1.8L4 7h3Zm2 0h6V6a3 3 0 0 0-6 0v1Z" />
              </svg>
              <span>Giỏ hàng</span>
              <em class="badge" id="cart-count">0</em>
            </a>
          </div>
        </div>
      </header>

  <form action="success.html" method="GET">
    <main class="checkout-container">
      
      <!-- CỘT TRÁI: THÔNG TIN KHÁCH HÀNG -->
      <div>
        <h2 class="checkout-heading">Thông tin mua hàng</h2>
        
        <div class="form-group">
          <input type="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Họ và tên" required>
        </div>
        <div class="form-group">
          <input type="tel" class="form-control" placeholder="Số điện thoại" required>
        </div>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="Địa chỉ" required>
        </div>
        
        <div class="form-row form-group">
          <select class="form-control" required>
            <option value="">Tỉnh thành</option>
            <option value="sg">Hồ Chí Minh</option>
            <option value="hn">Hà Nội</option>
            <option value="dn">Đà Nẵng</option>
          </select>
          <select class="form-control" required>
            <option value="">Quận huyện</option>
            <option value="q1">Quận 1</option>
            <option value="q2">Quận 2</option>
            <option value="q3">Quận 3</option>
          </select>
          <select class="form-control" required>
            <option value="">Phường xã</option>
            <option value="p1">Phường 1</option>
            <option value="p2">Phường 2</option>
          </select>
        </div>

        <div class="form-group">
          <textarea class="form-control" rows="3" placeholder="Ghi chú (tùy chọn)"></textarea>
        </div>
      </div>

      <!-- CỘT PHẢI: THANH TOÁN & ĐƠN HÀNG -->
      <div>
        <h2 class="checkout-heading">Thanh toán</h2>
        <div class="payment-box">
          <label class="payment-method">
            <input type="radio" name="payment" value="bank" checked>
            <span>Chuyển khoản</span>
          </label>
          
          <div id="bank-info" class="bank-details">
            <p>Ngân hàng: <strong>TP Bank</strong></p>
            <p>Chủ tài khoản: <strong>PHAN NGUYEN MINH TRUNG</strong></p>
            <p>Số tài khoản: <strong style="color: #fff; font-size: 16px;">24778798888</strong></p>
            <p style="font-size: 12px; margin-top: 10px;"><em>* Vui lòng nhập mã đơn hàng hoặc SĐT vào nội dung chuyển khoản.</em></p>
          </div>

          <label class="payment-method">
            <input type="radio" name="payment" value="cod">
            <span>Thu hộ (COD)</span>
          </label>
        </div>

        <h2 class="checkout-heading">Đơn hàng</h2>
        <div class="summary-box">
          <div id="checkout-cart-items">
            <!-- Sản phẩm render bằng JS -->
          </div>
          
          <div class="total-row">
            <span>Tạm tính</span>
            <span id="checkout-subtotal">0đ</span>
          </div>
          <div class="total-row">
            <span>Phí vận chuyển</span>
            <span>Miễn phí</span>
          </div>
          <div class="total-row final">
            <span>Tổng cộng</span>
            <span id="checkout-total">0đ</span>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 20px;">
            <a href="cart.html" style="color: #3b82f6; text-decoration: none; font-size: 14px; transition: color 0.3s;">❮ Quay về giỏ hàng</a>
            <button type="submit" class="btn-submit" style="margin-top: 0; width: 50%;">ĐẶT HÀNG</button>
          </div>
        </div>
      </div>
    </main>
  </form>

  <script>
    // Xử lý ẩn/hiện thông tin ngân hàng
    const paymentRadios = document.querySelectorAll('input[name="payment"]');
    const bankInfo = document.getElementById('bank-info');

    paymentRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'bank') {
          bankInfo.style.display = 'block';
        } else {
          bankInfo.style.display = 'none';
        }
      });
    });

    // Load dữ liệu giỏ hàng để hiển thị
    function loadCheckoutCart() {
      const cart = JSON.parse(localStorage.getItem("mt_cart")) || [];
      const container = document.getElementById("checkout-cart-items");
      const subtotalEl = document.getElementById("checkout-subtotal");
      const totalEl = document.getElementById("checkout-total");
      
      const money = (n) => n.toLocaleString("vi-VN") + "đ";

      if (cart.length === 0) {
        container.innerHTML = '<p style="color: #888; font-size: 14px;">Chưa có sản phẩm nào.</p>';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="summary-item">
          <img src="${item.image}" alt="${item.name}">
          <div class="summary-item-info">
            <h4>${item.name}</h4>
            <p>SL: ${item.quantity}</p>
          </div>
          <div class="summary-price">${money(item.price * item.quantity)}</div>
        </div>
      `).join('');

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      subtotalEl.textContent = money(subtotal);
      totalEl.textContent = money(subtotal);
    }

    document.addEventListener("DOMContentLoaded", loadCheckoutCart);
  </script>
</body>
</html>
