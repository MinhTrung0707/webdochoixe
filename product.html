<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm - MT Racing</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    * { box-sizing: border-box; }
    .product-page { max-width: 1200px; margin: 30px auto 60px; padding: 0 20px; font-family: 'Be Vietnam Pro', sans-serif; }
    .breadcrumb { color: #888; font-size: 14px; margin-bottom: 30px; }
    .breadcrumb a { color: #ccc; text-decoration: none; }
    .breadcrumb a:hover { color: #ff3333; }
    
    .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
    .product-gallery { display: flex; flex-direction: column; gap: 15px; }
    .main-image { width: 100%; height: 500px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid #333; }
    .thumbnail-list { display: flex; gap: 10px; }
    .thumbnail { width: 80px; height: 80px; object-fit: contain; background: #fff; border: 1px solid #333; border-radius: 4px; cursor: pointer; transition: border-color 0.3s; }
    .thumbnail:hover { border-color: #ff3333; }
    
    .product-info h1 { font-family: 'Oswald', sans-serif; font-size: 32px; color: #fff; margin: 0 0 10px 0; text-transform: uppercase; }
    .product-meta { color: #888; font-size: 14px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #222; }
    .product-meta span { margin-right: 15px; }
    
    .product-price { display: flex; align-items: baseline; gap: 15px; margin-bottom: 25px; }
    .price-now { font-size: 32px; font-weight: 700; color: #ff3333; }
    .price-old { font-size: 18px; color: #666; text-decoration: line-through; }
    
    .product-desc { color: #ccc; line-height: 1.6; margin-bottom: 30px; font-size: 15px; }
    
    .action-group { display: flex; gap: 15px; align-items: center; margin-bottom: 30px; }
    .qty-selector { display: flex; align-items: center; background: #111; border: 1px solid #333; border-radius: 4px; height: 50px; }
    .qty-btn { width: 40px; height: 100%; background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    .qty-btn:hover { color: #ff3333; }
    .qty-input { width: 50px; height: 100%; background: none; border: none; border-left: 1px solid #333; border-right: 1px solid #333; color: #fff; text-align: center; font-size: 16px; font-weight: bold; }
    
    .add-to-cart-btn { flex: 1; height: 50px; background: #ff3333; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: background 0.3s; }
    .add-to-cart-btn:hover { background: #e02828; }
    
    @media (max-width: 768px) {
      .product-layout { grid-template-columns: 1fr; gap: 30px; }
      .main-image { height: auto; aspect-ratio: 1/1; }
    }
  </style>
</head>
<body style="background: #0a0a0a; color: #fff; margin: 0;">
  
  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="index.html">
        <img src="images/logo-mt.jpg" alt="MT Racing" style="height: 52px; width: auto; object-fit: contain; display: block;" />
      </a>
      <div class="header-actions">
        <a class="icon-btn" href="cart.html" style="color: #ff3333;">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; fill: currentColor;"><path d="M7 7V6a5 5 0 0 1 10 0v1h3l-1.6 12.2A2 2 0 0 1 16.42 21H7.58a2 2 0 0 1-1.98-1.8L4 7h3Zm2 0h6V6a3 3 0 0 0-6 0v1Z"/></svg>
          <span>Giỏ hàng</span>
        </a>
      </div>
    </div>
  </header>

  <main class="product-page">
    <div class="breadcrumb">
      <a href="index.html">Trang chủ</a> / <a href="#" id="bread-category">Danh mục</a> / <span id="bread-name">Tên sản phẩm</span>
    </div>
    
    <div class="product-layout">
      <!-- Cột trái -->
      <div class="product-gallery">
        <img src="" alt="" class="main-image" id="main-img" />
        <div class="thumbnail-list">
          <img src="" class="thumbnail" id="thumb-img" onclick="document.getElementById('main-img').src=this.src" />
        </div>
      </div>
      
      <!-- Cột phải -->
      <div class="product-info">
        <h1 id="prod-title">Đang tải sản phẩm...</h1>
        <div class="product-meta">
          <span id="prod-pn">Mã SP: <strong>...</strong></span>
          <span id="prod-brand">Thương hiệu: <strong style="color: #fff;">...</strong></span>
          <span>Tình trạng: <strong style="color: #4ade80;">Còn hàng</strong></span>
        </div>
        
        <div class="product-price">
          <span class="price-now" id="prod-price-now">0đ</span>
          <span class="price-old" id="prod-price-old"></span>
        </div>
        
        <div class="product-desc">
          <p id="prod-desc">Sản phẩm chính hãng phân phối tại MT Racing. Đảm bảo chất lượng và độ bền bỉ cao, phù hợp lắp đặt cho nhiều dòng xe.</p>
        </div>
        
        <div class="action-group">
          <div class="qty-selector">
            <button class="qty-btn" onclick="modifyQty(-1)">-</button>
            <input type="text" id="buy-qty" class="qty-input" value="1" readonly />
            <button class="qty-btn" onclick="modifyQty(1)">+</button>
          </div>
          <button class="add-to-cart-btn" onclick="addToCart()">THÊM VÀO GIỎ HÀNG</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 1. Data danh sách sản phẩm (Copy lại từ main.js để trang này tự đứng độc lập)
    const PRODUCTS = [
      { 
        pn: "MT-PH-OH-V2", name: "Phuộc Ohlins TTX SH 350i chính hãng bình dầu", brand: "Ohlins", category: "Phuộc", price: 68000000, old: 72000000, image: "images/ohlins ttx.jpg",
        desc: "Phuộc Ohlins TTX cao cấp dành cho SH 350i, nhún êm ái, có núm tăng chỉnh độ nén nảy chuyên nghiệp. Bảo hành chính hãng 3 năm."
      },
      { 
        pn: "MT-TT-BR-CC19", name: "Tay thắng Brembo Corsa Corta RCS 15", brand: "Brembo", category: "Tay thắng", price: 13927000, old: 15474000, image: "images/Tay Thắng Brembo Corsa Corta 15.jpg",
        desc: `

            <li>Với Piston 15mm, tay thắng này phù hợp các dòng xe sử dụng 1 heo thắng 4 piston kích thước từ 30 đến 34mm.</li>
            <li>Khoảng cách trục đòn bẩy 18 - 20 mm cho ra lực thắng tốt.</li>
            <li>3 chế độ phanh: Normal / Sport / Race.
              <ul style="padding-left: 20px; margin-top: 10px; list-style-type: circle;">
                <li><strong>Normal</strong> được kí hiệu là chữ <span style="color: #ff3333;">N</span>: Chế độ này sẽ có một khoảng chờ khá dài để rà thắng, phù hợp để đi trong thành phố hoặc trong điều kiện có độ bám đường kém.</li>
                <li><strong>Sport</strong> được kí hiệu là chữ <span style="color: #ff3333;">S</span>: Khoảng chờ sẽ ngắn hơn so với chế độ N, phù hợp với các xe chuyên chạy đường trường với tốc độ cao.</li>
                <li><strong>Racing</strong> được kí hiệu là chữ <span style="color: #ff3333;">R</span>: Hầu như không có khoảng chờ, phù hợp sử dụng trên đường đua và được khuyến cáo hạn chế sử dụng trên đường phố.</li>
              </ul>
            </li>
          </ul>

              </tr>
              <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Hoàn Thiện</td>
                <td style="padding: 12px 15px; color: #fff;">Anode</td>
              </tr>
              <tr style="border-bottom: 1px solid #333; background: #0a0a0a;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Ø Piston</td>
                <td style="padding: 12px 15px; color: #fff;">15 mm</td>
              </tr>
              <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Khoảng Cách Trục Đòn Bẩy</td>
                <td style="padding: 12px 15px; color: #fff;">18 - 20 mm</td>
              </tr>
              <tr style="border-bottom: 1px solid #333; background: #0a0a0a;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Loại Lẫy</td>
                <td style="padding: 12px 15px; color: #fff;">Chống Gãy</td>
              </tr>
              <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Chiều Dài Lẫy</td>
                <td style="padding: 12px 15px; color: #fff;">Tiêu Chuẩn</td>
              </tr>
              <tr style="background: #0a0a0a;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Công Tắc</td>
                <td style="padding: 12px 15px; color: #fff;">Đi Kèm</td>
              </tr>
            </tbody>
          </table>
        `
      },
      { 
        pn: "MT-HD-BR-4P", name: "Tay Thắng Brembo Corsa Corta RR 15", brand: "Brembo", category: "Tay thắng", price: 32000000, old: 35000000, image: "images/Tay Thắng Brembo Corsa Corta RR 15.jpg",
        desc: `
          <p style="margin-bottom: 15px;">Tay Thắng Brembo Corsa Corta 15 - 110C74030</p>
          <ul style="padding-left: 20px; margin-bottom: 20px; line-height: 1.8;">
            <li>Tay thắng Brembo mang đến cảm giác và trải nghiệm tuyệt vời hơn khi điều khiển xe.</li>
            <li>Thiết kế cực đẹp, hầm hố và sắc sảo.</li>
            <li>Với Piston 15mm, tay thắng này phù hợp các dòng xe sử dụng 1 heo thắng 4 piston kích thước từ 30 đến 34mm.</li>
            <li>Khoảng cách trục đòn bẩy 18 - 20 mm cho ra lực thắng tốt.</li>
            <li>3 chế độ phanh: Normal / Sport / Race.
              <ul style="padding-left: 20px; margin-top: 10px; list-style-type: circle;">
                <li><strong>Normal</strong> được kí hiệu là chữ <span style="color: #ff3333;">N</span>: Chế độ này sẽ có một khoảng chờ khá dài để rà thắng, phù hợp để đi trong thành phố hoặc trong điều kiện có độ bám đường kém.</li>
                <li><strong>Sport</strong> được kí hiệu là chữ <span style="color: #ff3333;">S</span>: Khoảng chờ sẽ ngắn hơn so với chế độ N, phù hợp với các xe chuyên chạy đường trường với tốc độ cao.</li>
                <li><strong>Racing</strong> được kí hiệu là chữ <span style="color: #ff3333;">R</span>: Hầu như không có khoảng chờ, phù hợp sử dụng trên đường đua và được khuyến cáo hạn chế sử dụng trên đường phố.</li>
              </ul>
            </li>
          </ul>
          
          <table style="width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 14px; background: #111;">
            <tbody>
              <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px 15px; width: 40%; color: #aaa; font-weight: bold;">Chất Liệu</td>
                <td style="padding: 12px 15px; color: #fff;">Nhôm</td>
              </tr>
              <tr style="border-bottom: 1px solid #333; background: #0a0a0a;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Gia Công</td>
                <td style="padding: 12px 15px; color: #fff;">CNC</td>
              </tr>
              <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Hoàn Thiện</td>
                <td style="padding: 12px 15px; color: #fff;">Anode</td>
              </tr>
              <tr style="border-bottom: 1px solid #333; background: #0a0a0a;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Ø Piston</td>
                <td style="padding: 12px 15px; color: #fff;">15 mm</td>
              </tr>
              <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Khoảng Cách Trục Đòn Bẩy</td>
                <td style="padding: 12px 15px; color: #fff;">18 - 20 mm</td>
              </tr>
              <tr style="border-bottom: 1px solid #333; background: #0a0a0a;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Loại Lẫy</td>
                <td style="padding: 12px 15px; color: #fff;">Chống Gãy</td>
              </tr>
              <tr style="border-bottom: 1px solid #333;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Chiều Dài Lẫy</td>
                <td style="padding: 12px 15px; color: #fff;">Tiêu Chuẩn</td>
              </tr>
              <tr style="background: #0a0a0a;">
                <td style="padding: 12px 15px; color: #aaa; font-weight: bold;">Công Tắc</td>
                <td style="padding: 12px 15px; color: #fff;">Đi Kèm</td>
              </tr>
            </tbody>
          </table>
        `
      },
      { 
        pn: "MT-PO-AK-CR", name: "Tay Thắng Brembo RCS 14", brand: "Brembo", category: "Tay thắng", price: 7400000, old: 7800000, image: "images/Tay Thắng Brembo RCS 14.JPG",
        desc: "Kích thước piston 14mm, lý tưởng cho xe tay ga hoặc xe côn tay cỡ nhỏ. Cảm giác bóp thắng nhẹ nhàng, chuẩn xác."
      },
      { 
        pn: "MT-NSD-UMA-428", name: "Tay Thắng Brembo RCS 15", brand: "Brembo", category: "Tay thắng", price: 7600000, old: 8500000, image: "images/Tay Thắng Brembo RCS 15.JPG",
        desc: "Dòng RCS 15 tiêu chuẩn, độ bền cao, tăng cường độ an toàn và thẩm mỹ cho dàn đầu xe của bạn."
      },
      { 
        pn: "MT-LED-NGK-BI", name: "Phuộc sau Shark X2 điện Honda SH350i", brand: "Taiwan", category: "Phuộc", price: 45000000, old: 48790000, image: "images/Shark-X2-Dien-Honda-SH350i.jpg",
        desc: "Phuộc điện tử Shark X2 thông minh, tự động điều chỉnh độ nhún theo địa hình và tải trọng, công nghệ hiện đại nhất cho SH350i."
      }
    ];

    let currentProduct = null;

    // 2. Logic quét ID trên link và nạp giao diện tự động
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      
      currentProduct = PRODUCTS.find(p => p.pn === productId);
      if(!currentProduct) currentProduct = PRODUCTS[0]; // Dự phòng nếu gõ sai link

      document.title = currentProduct.name + " - MT Racing";
      document.getElementById("bread-category").textContent = currentProduct.category;
      document.getElementById("bread-name").textContent = currentProduct.name;
      
      document.getElementById("main-img").src = currentProduct.image;
      document.getElementById("thumb-img").src = currentProduct.image;
      
      document.getElementById("prod-title").textContent = currentProduct.name;
      document.getElementById("prod-pn").innerHTML = `Mã SP: <strong>${currentProduct.pn}</strong>`;
      document.getElementById("prod-brand").innerHTML = `Thương hiệu: <strong style="color: #fff;">${currentProduct.brand}</strong>`;
      
      document.getElementById("prod-price-now").textContent = currentProduct.price.toLocaleString("vi-VN") + "đ";
      if (currentProduct.old) {
        document.getElementById("prod-price-old").textContent = currentProduct.old.toLocaleString("vi-VN") + "đ";
      }

      // Xử lý nạp mô tả sản phẩm
      if (currentProduct.desc) {
        document.getElementById("prod-desc").innerHTML = currentProduct.desc;
      }
    });

    // 3. Xử lý nút tăng giảm số lượng
    function modifyQty(val) {
      let input = document.getElementById("buy-qty");
      let current = parseInt(input.value);
      if (current + val >= 1) input.value = current + val;
    }

    // 4. Xử lý Thêm giỏ hàng chuẩn
    function addToCart() {
      if(!currentProduct) return;
      
      const qty = parseInt(document.getElementById("buy-qty").value);
      let cart = JSON.parse(localStorage.getItem("mt_cart")) || [];
      let existingItem = cart.find(item => item.pn === currentProduct.pn);
      
      if (existingItem) {
        existingItem.quantity += qty;
      } else {
        cart.push({ ...currentProduct, quantity: qty });
      }
      
      localStorage.setItem("mt_cart", JSON.stringify(cart));
      window.location.href = "cart.html";
    }
  </script>
  
</body>
</html>
